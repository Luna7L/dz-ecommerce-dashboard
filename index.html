
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna Store - إدارة المتجر</title>
<style>
:root {
  --bg:#f5f6f8;
  --surface:#ffffff;
  --text:#20242d;
  --muted:#858b98;
  --border:#e9ebef;
  --primary:#6654a3;
  --primary-light:#f0edfa;
  --green:#21865b;
  --red:#c64d56;
  --orange:#c68b38;
  --sidebar:#20212b;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Tahoma,Arial,sans-serif;font-size:14px;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
 width:245px;background:var(--sidebar);color:white;
 padding:25px 16px;position:fixed;right:0;top:0;bottom:0;
 display:flex;flex-direction:column;z-index:20;
}
.brand{font-size:21px;font-weight:bold;padding:5px 12px 30px;letter-spacing:1px}
.brand small{display:block;font-size:10px;color:#9293a1;margin-top:7px;font-weight:normal}
.nav-label{font-size:10px;color:#777986;padding:10px 12px}
.nav-btn{
 display:flex;align-items:center;gap:12px;width:100%;
 border:0;background:none;color:#b8b9c5;padding:13px 12px;
 border-radius:8px;text-align:right;margin:2px 0;
 transition:.2s;
}
.nav-btn:hover{background:#30313d;color:white}
.nav-btn.active{background:#40385c;color:white}
.nav-icon{width:20px;text-align:center;font-size:16px}
.sidebar-bottom{margin-top:auto;border-top:1px solid #393a45;padding-top:18px}
.main{margin-right:245px;width:calc(100% - 245px);min-width:0}
.topbar{
 height:75px;background:white;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 35px;position:sticky;top:0;z-index:10;
}
.top-title{font-weight:bold;font-size:15px}
.top-actions{display:flex;align-items:center;gap:16px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-light);
 color:var(--primary);display:grid;place-items:center;font-weight:bold}
.content{padding:30px 35px;max-width:1500px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}
h1{font-size:23px;margin:0 0 8px}
.subtitle{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:22px}
.card{
 background:var(--surface);border:1px solid var(--border);
 border-radius:10px;padding:21px;
}
.stat-label{font-size:12px;color:var(--muted)}
.stat-value{font-size:25px;font-weight:bold;margin:15px 0 8px}
.stat-note{font-size:11px;color:var(--muted)}
.green{color:var(--green)}.red{color:var(--red)}
.section{margin-bottom:22px}
.section-title{font-weight:bold;font-size:14px;margin-bottom:17px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.btn{
 border:1px solid var(--border);background:white;color:var(--text);
 padding:10px 15px;border-radius:7px;font-size:12px;
}
.btn:hover{background:#f7f7fa}
.btn-primary{background:var(--primary);color:white;border-color:var(--primary)}
.btn-primary:hover{background:#55458d}
.btn-danger{color:var(--red)}
.btn-small{padding:6px 10px;font-size:11px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search{
 background:white;border:1px solid var(--border);border-radius:7px;
 padding:10px 13px;min-width:220px;outline:none;
}
.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--primary)}
select{
 border:1px solid var(--border);border-radius:7px;
 background:white;padding:10px;outline:none;color:var(--text);
}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{
 color:var(--muted);font-size:11px;font-weight:normal;
 text-align:right;background:#fafafa;padding:14px 13px;
}
td{padding:15px 13px;border-bottom:1px solid var(--border);font-size:12px}
tr:last-child td{border-bottom:0}
.badge{
 display:inline-block;border-radius:5px;padding:5px 9px;
 font-size:10px;background:#f0f0f0;color:#555;
}
.badge-green{background:#e7f5ed;color:#21865b}
.badge-red{background:#fcebec;color:#bd454f}
.badge-orange{background:#fff4e2;color:#a97629}
.badge-purple{background:#f0edfa;color:#6654a3}
.empty{text-align:center;padding:40px;color:var(--muted)}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.alert{
 padding:13px;border-radius:7px;background:#fff8eb;
 border:1px solid #f1e4c9;margin:9px 0;font-size:12px;
 display:flex;justify-content:space-between;gap:10px;
}
.product-name{font-weight:bold}
.muted{color:var(--muted)}
.actions{display:flex;gap:6px}
.bar-row{display:grid;grid-template-columns:100px 1fr 75px;align-items:center;gap:10px;margin:17px 0;font-size:11px}
.bar{height:9px;background:#eee;border-radius:20px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--primary);border-radius:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{
 width:100%;padding:11px;border:1px solid var(--border);
 border-radius:7px;background:white;outline:none;
}
.field textarea{resize:vertical;min-height:75px}
.modal-backdrop{
 display:none;position:fixed;inset:0;background:#0007;
 z-index:50;align-items:center;justify-content:center;padding:15px;
}
.modal-backdrop.open{display:flex}
.modal{
 background:white;border-radius:12px;padding:25px;
 width:100%;max-width:530px;max-height:90vh;overflow:auto;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-head h2{font-size:17px}
.close{border:0;background:none;font-size:23px;color:var(--muted)}
.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.mobile-menu{display:none}
.toast{
 position:fixed;bottom:25px;left:25px;background:#262732;
 color:white;padding:13px 20px;border-radius:8px;
 opacity:0;pointer-events:none;transition:.25s;z-index:100;
}
.toast.show{opacity:1}
@media(max-width:1100px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .content{padding:25px 20px}
}
@media(max-width:750px){
 .sidebar{transform:translateX(100%);transition:.25s}
 .sidebar.open{transform:translateX(0)}
 .main{margin-right:0;width:100%}
 .topbar{padding:0 17px}
 .mobile-menu{display:block;border:0;background:none;font-size:22px}
 .content{padding:22px 14px}
 .two-col{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}
 .page-head{align-items:flex-start}
}
@media(max-width:420px){
 .grid{grid-template-columns:1fr 1fr;gap:9px}
 .card{padding:13px}
 .stat-value{font-size:19px}
 .search{min-width:100%}
}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar" id="sidebar">
 <div class="brand">LUNA STORE
  <small>STORE MANAGEMENT SYSTEM</small>
 </div>
 <div class="nav-label">إدارة المتجر</div>
 <button class="nav-btn active" data-page="overview"><span class="nav-icon">▦</span> الرئيسية</button>
 <button class="nav-btn" data-page="orders"><span class="nav-icon">▤</span> الطلبات</button>
 <button class="nav-btn" data-page="products"><span class="nav-icon">▧</span> المنتجات</button>
 <button class="nav-btn" data-page="inventory"><span class="nav-icon">▥</span> المخزون</button>
 <button class="nav-btn" data-page="customers"><span class="nav-icon">♙</span> العملاء</button>
 <div class="nav-label">العمليات المالية واللوجستية</div>
 <button class="nav-btn" data-page="shipping"><span class="nav-icon">⇢</span> التوصيل</button>
 <button class="nav-btn" data-page="payments"><span class="nav-icon">▣</span> المدفوعات</button>
 <div class="nav-label">تحليل وإعداد</div>
 <button class="nav-btn" data-page="analytics"><span class="nav-icon">▤</span> التحليلات</button>
 <button class="nav-btn" data-page="settings"><span class="nav-icon">⚙</span> الإعدادات</button>
 <div class="sidebar-bottom">
  <div class="nav-btn"><span class="nav-icon">◉</span> مساعدة ودعم</div>
 </div>
</aside>

<main class="main">
<header class="topbar">
 <div style="display:flex;align-items:center;gap:12px">
  <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
  <span class="top-title" id="topTitle">نظرة عامة</span>
 </div>
 <div class="top-actions">
  <span class="muted" style="font-size:11px">مدير المتجر</span>
  <div class="avatar">م</div>
 </div>
</header>

<div class="content" id="content"></div>
</main>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
 <div class="modal">
  <div class="modal-head">
   <h2 id="modalTitle">إضافة عنصر</h2>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <form id="modalForm">
   <div id="modalFields" class="form-grid"></div>
   <div class="modal-footer">
    <button type="button" class="btn" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-primary" type="submit">حفظ</button>
   </div>
  </form>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const initial = {
 products:[
  {id:1,name:"فستان كلاسيكي",sku:"DR-001",price:8500,stock:12,category:"ملابس"},
  {id:2,name:"حقيبة جلدية",sku:"BG-002",price:6200,stock:2,category:"حقائب"},
  {id:3,name:"قميص قطني",sku:"SH-003",price:3900,stock:28,category:"ملابس"},
  {id:4,name:"حذاء رياضي",sku:"SH-004",price:7500,stock:0,category:"أحذية"},
  {id:5,name:"طقم صيفي",sku:"ST-005",price:9800,stock:7,category:"ملابس"}
 ],
 customers:[
  {id:1,name:"سارة محمد",phone:"0550123456",city:"الجزائر",orders:5},
  {id:2,name:"أمينة خالد",phone:"0660123456",city:"وهران",orders:3},
  {id:3,name:"ليلى أحمد",phone:"0770123456",city:"قسنطينة",orders:8},
  {id:4,name:"مريم علي",phone:"0550987654",city:"البليدة",orders:2}
 ],
 orders:[
  {id:1048,customer:"سارة محمد",phone:"0550123456",product:"فستان كلاسيكي",total:8500,status:"جديد",payment:"عند الاستلام",shipping:"لم يشحن",date:"2026-11-14"},
  {id:1047,customer:"أمينة خالد",phone:"0660123456",product:"حقيبة جلدية",total:6200,status:"قيد المعالجة",payment:"عند الاستلام",shipping:"قيد التجهيز",date:"2026-11-14"},
  {id:1046,customer:"نور الدين",phone:"0770234567",product:"قميص قطني",total:3900,status:"تم الشحن",payment:"مدفوع",shipping:"تم الشحن",date:"2026-11-13"},
  {id:1045,customer:"ليلى أحمد",phone:"0770345678",product:"طقم صيفي",total:9800,status:"جديد",payment:"عند الاستلام",shipping:"لم يشحن",date:"2026-11-13"},
  {id:1044,customer:"مريم علي",phone:"0550987654",product:"حذاء رياضي",total:7500,status:"ملغي",payment:"غير مدفوع",shipping:"ملغي",date:"2026-11-12"},
  {id:1043,customer:"سارة محمد",phone:"0550123456",product:"قميص قطني",total:3900,status:"تم التسليم",payment:"مدفوع",shipping:"تم التسليم",date:"2026-11-11"}
 ]
};

let db;
try {
 db=JSON.parse(localStorage.getItem("lunaData"))||initial;
} catch(e){db=initial;}

let currentPage="overview";
let searchTerm="";
let orderFilter="الكل";
let editingId=null;
let modalType="";

function save(){
 localStorage.setItem("lunaData",JSON.stringify(db));
}
function money(n){return Number(n).toLocaleString("en-US")+" دج";}
function toast(msg){
 const el=document.getElementById("toast");
 el.textContent=msg;el.classList.add("show");
 setTimeout(()=>el.classList.remove("show"),2300);
}
function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("open");
}
function go(page){
 currentPage=page;searchTerm="";
 document.querySelectorAll(".nav-btn[data-page]").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===page);
 });
 const names={
  overview:"نظرة عامة",orders:"الطلبات",products:"المنتجات",
  inventory:"المخزون",customers:"العملاء",shipping:"التوصيل",
  payments:"المدفوعات",analytics:"التحليلات",settings:"الإعدادات"
 };
 document.getElementById("topTitle").textContent=names[page];
 document.getElementById("sidebar").classList.remove("open");
 render();
}
document.querySelectorAll(".nav-btn[data-page]").forEach(b=>{
 b.addEventListener("click",()=>go(b.dataset.page));
});

function badge(status){
 const map={
 "جديد":"badge-orange","قيد المعالجة":"badge-purple",
 "تم الشحن":"badge-green","تم التسليم":"badge-green",
 "ملغي":"badge-red","مدفوع":"badge-green",
 "غير مدفوع":"badge-red","عند الاستلام":"badge-orange",
 "لم يشحن":"badge-orange","قيد التجهيز":"badge-purple"
 };
 return `<span class="badge ${map[status]||''}">${status}</span>`;
}
function pageHead(title,sub,button=""){
 return `<div class="page-head"><div><h1>${title}</h1>
 <div class="subtitle">${sub}</div></div>${button}</div>`;
}
function stat(label,value,note){
 return `<div class="card"><div class="stat-label">${label}</div>
 <div class="stat-value">${value}</div>
 <div class="stat-note">${note}</div></div>`;
}
function searchBox(placeholder="بحث..."){
 return `<input class="search" id="searchInput" placeholder="${placeholder}" value="${searchTerm}" oninput="searchTerm=this.value;renderTableOnly()">`;
}
function tableHead(headers){
 return `<thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`;
}
function render(){
 const c=document.getElementById("content");
 const views={
 overview:overviewPage,orders:ordersPage,products:productsPage,
 inventory:inventoryPage,customers:customersPage,
 shipping:shippingPage,payments:paymentsPage,
 analytics:analyticsPage,settings:settingsPage
 };
 c.innerHTML=views[currentPage]();
}

function overviewPage(){
 const revenue=db.orders.filter(o=>o.status==="تم التسليم").reduce((s,o)=>s+o.total,0);
 const pending=db.orders.filter(o=>o.status==="جديد").length;
 const low=db.products.filter(p=>p.stock<=3);
 return `
 ${pageHead("نظرة عامة","ملخص نشاط متجرك")}
 <div class="grid">
 ${stat("إجمالي المبيعات",money(revenue),"الطلبات المسلّمة")}
 ${stat("إجمالي الطلبات",db.orders.length,"جميع الطلبات المسجلة")}
 ${stat("طلبات جديدة",pending,"تحتاج إلى مراجعة")}
 ${stat("عدد المنتجات",db.products.length,"في كتالوج المتجر")}
 </div>
 <div class="two-col">
 <div class="card">
  <div class="panel-head"><strong>أحدث الطلبات</strong>
  <button class="btn btn-small" onclick="go('orders')">عرض جميع الطلبات</button></div>
  ${ordersTable(db.orders.slice(0,5),false)}
 </div>
 <div class="card">
  <div class="section-title">تنبيهات المخزون</div>
  ${low.length?low.map(p=>`<div class="alert"><span>${p.name}</span><strong>${p.stock===0?"نفد المخزون":`بقي ${p.stock}`}</strong></div>`).join(""):'<div class="empty">لا توجد تنبيهات حالياً</div>'}
  <button class="btn" style="margin-top:12px" onclick="go('inventory')">إدارة المخزون</button>
 </div>
 </div>
 `;
}

function ordersTable(list,withActions=true){
 if(!list.length)return '<div class="empty">لا توجد طلبات مطابقة.</div>';
 return `<div class="table-wrap"><table>
 ${tableHead(["رقم الطلب","العميل","المنتج","الإجمالي","الحالة","التاريخ",...(withActions?["الإجراء"]:[])])}
 <tbody>${list.map(o=>`<tr>
 <td><strong>#${o.id}</strong></td><td>${o.customer}</td>
 <td>${o.product}</td><td>${money(o.total)}</td>
 <td>${badge(o.status)}</td><td>${o.date}</td>
 ${withActions?`<td><div class="actions">
 <button class="btn btn-small" onclick="orderDetails(${o.id})">التفاصيل</button>
 </div></td>`:""}
 </tr>`).join("")}</tbody></table></div>`;
}
function ordersPage(){
 let list=db.orders.filter(o=>
  (`${o.id} ${o.customer} ${o.phone} ${o.product}`).includes(searchTerm)
  &&(orderFilter==="الكل"||o.status===orderFilter)
 );
 return `${pageHead("الطلبات","متابعة ومعالجة طلبات العملاء")}
 <div class="card">
 <div class="tools">
 ${searchBox("ابحثي برقم الطلب أو اسم العميل")}
 <select onchange="orderFilter=this.value;render()">
 ${["الكل","جديد","قيد المعالجة","تم الشحن","تم التسليم","ملغي"].map(x=>`<option ${orderFilter===x?"selected":""}>${x}</option>`).join("")}
 </select>
 </div>
 <div id="ordersTable">${ordersTable(list)}</div>
 </div>`;
}
function renderTableOnly(){
 if(currentPage==="orders"){
  let list=db.orders.filter(o=>
   (`${o.id} ${o.customer} ${o.phone} ${o.product}`).includes(searchTerm)
   &&(orderFilter==="الكل"||o.status===orderFilter)
  );
  document.getElementById("ordersTable").innerHTML=ordersTable(list);
 }
 if(currentPage==="products"){
  let list=db.products.filter(p=>(`${p.name} ${p.sku} ${p.category}`).includes(searchTerm));
  document.getElementById("productsTable").innerHTML=productsTable(list);
 }
 if(currentPage==="customers"){
  let list=db.customers.filter(p=>(`${p.name} ${p.phone} ${p.city}`).includes(searchTerm));
  document.getElementById("customersTable").innerHTML=customersTable(list);
 }
}

function productsTable(list){
 if(!list.length)return '<div class="empty">لا توجد منتجات.</div>';
 return `<div class="table-wrap"><table>
 ${tableHead(["المنتج","رمز المنتج","التصنيف","السعر","المخزون","الإجراءات"])}
 <tbody>${list.map(p=>`<tr>
 <td><strong>${p.name}</strong></td><td>${p.sku}</td>
 <td>${p.category}</td><td>${money(p.price)}</td>
 <td>${p.stock<=3?badge(p.stock===0?"ملغي":"جديد"):p.stock}</td>
 <td><div class="actions">
 <button class="btn btn-small" onclick="editProduct(${p.id})">تعديل</button>
 <button class="btn btn-small btn-danger" onclick="deleteProduct(${p.id})">حذف</button>
 </div></td></tr>`).join("")}</tbody></table></div>`;
}
function productsPage(){
 return `${pageHead("المنتجات","إدارة الكتالوج والأسعار والكميات",
 '<button class="btn btn-primary" onclick="addProduct()">+ إضافة منتج</button>')}
 <div class="card">${searchBox("البحث باسم المنتج أو رمزه")}
 <div id="productsTable" style="margin-top:18px">${productsTable(db.products)}</div></div>`;
}
function inventoryPage(){
 return `${pageHead("إدارة المخزون","مراقبة الكميات والمنتجات منخفضة المخزون")}
 <div class="grid">
 ${stat("إجمالي الوحدات",db.products.reduce((s,p)=>s+p.stock,0),"جميع المنتجات")}
 ${stat("منتجات منخفضة",db.products.filter(p=>p.stock>0&&p.stock<=3).length,"3 قطع أو أقل")}
 ${stat("منتجات نفدت",db.products.filter(p=>p.stock===0).length,"تحتاج إلى إعادة توفير")}
 ${stat("أنواع المنتجات",db.products.length,"عدد الأصناف")}
 </div>
 <div class="card">
 <div class="section-title">حالة المخزون</div>
 <div class="table-wrap"><table>${tableHead(["المنتج","رمز المنتج","الكمية المتاحة","حالة المخزون","تعديل الكمية"])}
 <tbody>${db.products.map(p=>`<tr>
 <td><strong>${p.name}</strong></td><td>${p.sku}</td><td>${p.stock}</td>
 <td>${p.stock===0?badge("نفد المخزون"):p.stock<=3?badge("جديد"):badge("متوفر")}</td>
 <td><button class="btn btn-small" onclick="adjustStock(${p.id})">تعديل الكمية</button></td>
 </tr>`).join("")}</tbody></table></div>
 </div>`;
}
function customersTable(list){
 if(!list.length)return '<div class="empty">لا يوجد عملاء.</div>';
 return `<div class="table-wrap"><table>
 ${tableHead(["اسم العميل","رقم الهاتف","المدينة","عدد الطلبات"])}
 <tbody>${list.map(c=>`<tr><td><strong>${c.name}</strong></td>
 <td>${c.phone}</td><td>${c.city}</td><td>${c.orders}</td></tr>`).join("")}</tbody></table></div>`;
}
function customersPage(){
 return `${pageHead("العملاء","قاعدة بيانات العملاء وسجل مشترياتهم")}
 <div class="card">${searchBox("ابحثي باسم العميل أو الهاتف أو المدينة")}
 <div id="customersTable" style="margin-top:18px">${customersTable(db.customers)}</div></div>`;
}
function shippingPage(){
 return `${pageHead("إدارة التوصيل","متابعة تجهيز وشحن وتسليم الطلبات")}
 <div class="card"><div class="table-wrap"><table>
 ${tableHead(["الطلب","العميل","المدينة","حالة الشحن","الإجراء"])}
 <tbody>${db.orders.filter(o=>o.status!=="ملغي").map(o=>`<tr>
 <td>#${o.id}</td><td>${o.customer}</td><td>غير محددة</td>
 <td>${badge(o.shipping)}</td>
 <td><button class="btn btn-small" onclick="changeShipping(${o.id})">تحديث الحالة</button></td>
 </tr>`).join("")}</tbody></table></div></div>`;
}
function paymentsPage(){
 return `${pageHead("المدفوعات","متابعة المبالغ وحالات الدفع")}
 <div class="grid">
 ${stat("مدفوع",db.orders.filter(o=>o.payment==="مدفوع").length,"عدد الطلبات")}
 ${stat("عند الاستلام",db.orders.filter(o=>o.payment==="عند الاستلام").length,"الدفع عند التسليم")}
 ${stat("غير مدفوع",db.orders.filter(o=>o.payment==="غير مدفوع").length,"طلبات غير مسددة")}
 ${stat("المبالغ المحصلة",money(db.orders.filter(o=>o.payment==="مدفوع").reduce((s,o)=>s+o.total,0)),"إجمالي مسجل")}
 </div>
 <div class="card"><div class="table-wrap"><table>
 ${tableHead(["رقم الطلب","العميل","المبلغ","طريقة الدفع","الحالة","الإجراء"])}
 <tbody>${db.orders.map(o=>`<tr><td>#${o.id}</td><td>${o.customer}</td>
 <td>${money(o.total)}</td><td>${o.payment}</td><td>${badge(o.payment)}</td>
 <td><button class="btn btn-small" onclick="changePayment(${o.id})">تحديث الدفع</button></td></tr>`).join("")}</tbody>
 </table></div></div>`;
}
function analyticsPage(){
 const delivered=db.orders.filter(o=>o.status==="تم التسليم");
 const total=delivered.reduce((s,o)=>s+o.total,0);
 const counts=db.products.map(p=>({name:p.name,count:db.orders.filter(o=>o.product===p.name).length}));
 const max=Math.max(1,...counts.map(p=>p.count));
 return `${pageHead("التحليلات","مؤشرات أداء المتجر بناءً على البيانات المسجلة")}
 <div class="grid">
 ${stat("المبيعات المسلّمة",money(total),"حسب البيانات التجريبية")}
 ${stat("الطلبات المكتملة",delivered.length,"تم التسليم")}
 ${stat("متوسط قيمة الطلب",money(delivered.length?Math.round(total/delivered.length):0),"الطلبات المسلّمة")}
 ${stat("عدد المنتجات",db.products.length,"في المتجر")}
 </div>
 <div class="card">
 <div class="section-title">عدد الطلبات حسب المنتج</div>
 ${counts.map(p=>`<div class="bar-row"><span>${p.name}</span>
 <div class="bar"><span style="width:${p.count/max*100}%"></span></div>
 <strong>${p.count} طلب</strong></div>`).join("")}
 </div>`;
}
function settingsPage(){
 return `${pageHead("إعدادات المتجر","إدارة المعلومات الأساسية والتفضيلات")}
 <div class="card">
 <form onsubmit="saveSettings(event)">
 <div class="form-grid">
 <div class="field"><label>اسم المتجر</label><input name="store" value="${localStorage.getItem("storeName")||"Luna Store"}"></div>
 <div class="field"><label>رقم الهاتف</label><input name="phone" value="${localStorage.getItem("storePhone")||""}" placeholder="رقم التواصل"></div>
 <div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" value="${localStorage.getItem("storeEmail")||""}"></div>
 <div class="field"><label>المدينة</label><input name="city" value="${localStorage.getItem("storeCity")||"الجزائر"}"></div>
 <div class="field"><label>العملة</label><select name="currency"><option>DZD - دينار جزائري</option></select></div>
 <div class="field"><label>لغة المتجر</label><select name="language"><option>العربية</option><option>Français</option></select></div>
 </div>
 <button class="btn btn-primary" style="margin-top:22px">حفظ الإعدادات</button>
 </form>
 </div>
 <div class="card section" style="margin-top:20px">
 <div class="section-title">إدارة البيانات</div>
 <p class="muted">يمكنك إعادة المتجر إلى البيانات التجريبية الأصلية.</p>
 <button class="btn btn-danger" onclick="resetData()">إعادة تعيين البيانات</button>
 </div>`;
}

// Modal system
function openModal(title,fields,type,id=null){
 modalType=type;editingId=id;
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalFields").innerHTML=fields.map(f=>`
 <div class="field">
 <label>${f.label}</label>
 ${f.options?`<select name="${f.name}">${f.options.map(x=>`<option>${x}</option>`).join("")}</select>`:
 `<input name="${f.name}" type="${f.type||"text"}" value="${f.value??""}" ${f.required===false?"":"required"} placeholder="${f.placeholder||""}">`}
 </div>`).join("");
 document.getElementById("modalBackdrop").classList.add("open");
}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("open");}
function addProduct(){
 openModal("إضافة منتج",[
  {name:"name",label:"اسم المنتج"},
  {name:"sku",label:"رمز المنتج"},
  {name:"category",label:"التصنيف"},
  {name:"price",label:"السعر بالدينار",type:"number"},
  {name:"stock",label:"الكمية",type:"number"}
 ],"addProduct");
}
function editProduct(id){
 const p=db.products.find(x=>x.id===id);
 openModal("تعديل المنتج",[
  {name:"name",label:"اسم المنتج",value:p.name},
  {name:"sku",label:"رمز المنتج",value:p.sku},
  {name:"category",label:"التصنيف",value:p.category},
  {name:"price",label:"السعر",type:"number",value:p.price},
  {name:"stock",label:"الكمية",type:"number",value:p.stock}
 ],"editProduct",id);
}
function adjustStock(id){
 const p=db.products.find(x=>x.id===id);
 const amount=prompt("أدخلي الكمية الجديدة للمنتج "+p.name,p.stock);
 if(amount===null||amount.trim()===""||!Number.isInteger(Number(amount))||Number(amount)<0)return;
 p.stock=Number(amount);save();render();toast("تم تحديث المخزون");
}
function deleteProduct(id){
 if(!confirm("هل أنت متأكدة من حذف هذا المنتج؟"))return;
 db.products=db.products.filter(p=>p.id!==id);
 save();render();toast("تم حذف المنتج");
}
document.getElementById("modalForm").addEventListener("submit",e=>{
 e.preventDefault();
 const data=Object.fromEntries(new FormData(e.target));
 if(modalType==="addProduct"){
  db.products.push({...data,id:Date.now(),price:Number(data.price),stock:Number(data.stock)});
 }else if(modalType==="editProduct"){
  const p=db.products.find(x=>x.id===editingId);
  Object.assign(p,{...data,price:Number(data.price),stock:Number(data.stock)});
 }
 save();closeModal();render();toast("تم حفظ التغييرات");
});
function orderDetails(id){
 const o=db.orders.find(x=>x.id===id);
 const next=prompt(
 `الطلب #${o.id}\nالعميل: ${o.customer}\nالمنتج: ${o.product}\nالمبلغ: ${money(o.total)}\nالحالة الحالية: ${o.status}\n\nاكتبي الحالة الجديدة:\nجديد / قيد المعالجة / تم الشحن / تم التسليم / ملغي`,
 o.status
 );
 const allowed=["جديد","قيد المعالجة","تم الشحن","تم التسليم","ملغي"];
 if(next===null)return;
 if(!allowed.includes(next.trim())){toast("الحالة غير صحيحة");return;}
 o.status=next.trim();
 if(next==="تم الشحن"||next==="تم التسليم")o.shipping=next;
 if(next==="تم التسليم")o.payment="مدفوع";
 save();render();toast("تم تحديث الطلب");
}
function changeShipping(id){
 const o=db.orders.find(x=>x.id===id);
 const s=prompt("حالة الشحن:\nلم يشحن / قيد التجهيز / تم الشحن / تم التسليم",o.shipping);
 if(s===null)return;
 if(!["لم يشحن","قيد التجهيز","تم الشحن","تم التسليم"].includes(s.trim()))return;
 o.shipping=s.trim();
 if(s==="تم الشحن"||s==="تم التسليم")o.status=s.trim();
 save();render();toast("تم تحديث الشحن");
}
function changePayment(id){
 const o=db.orders.find(x=>x.id===id);
 const s=prompt("حالة الدفع:\nمدفوع / غير مدفوع / عند الاستلام",o.payment);
 if(s===null)return;
 if(!["مدفوع","غير مدفوع","عند الاستلام"].includes(s.trim()))return;
 o.payment=s.trim();save();render();toast("تم تحديث الدفع");
}
function saveSettings(e){
 e.preventDefault();
 const d=Object.fromEntries(new FormData(e.target));
 localStorage.setItem("storeName",d.store);
 localStorage.setItem("storePhone",d.phone);
 localStorage.setItem("storeEmail",d.email);
 localStorage.setItem("storeCity",d.city);
 toast("تم حفظ الإعدادات");
}
function resetData(){
 if(!confirm("سيتم حذف التعديلات وإعادة البيانات التجريبية. هل تريدين المتابعة؟"))return;
 db=JSON.parse(JSON.stringify(initial));
 save();render();toast("تمت إعادة البيانات");
}
render();
</script>
</body>
</html>
